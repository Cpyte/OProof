[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opreof"
version = "0.1.0"
description = "Bit-exact machine-integer equivalence proving by rewriting, equality saturation, and exhaustive solving"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cpyte" }]
keywords = [
    "equivalence",
    "bit-exact",
    "machine-integer",
    "theorem-prover",
    "rewriting",
    "e-graph",
    "smt",
    "verification",
    "bitvector",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Cpyte/OProof"
Repository = "https://github.com/Cpyte/OProof"
Source = "https://gitea.5gnew.io.vn/Cpyte-Project/Oproof"

[project.scripts]
opreof-check = "test_kernel:main"

[tool.hatch.build.targets.wheel.force-include]
"api.py" = "api.py"
"kernel.py" = "kernel.py"
"axiom_store.py" = "axiom_store.py"
"egraphs.py" = "egraphs.py"
"generalization.py" = "generalization.py"
"opreof.py" = "opreof.py"
"solving.py" = "solving.py"
"test_kernel.py" = "test_kernel.py"
"axioms" = "axioms"

[tool.hatch.build.targets.sdist]
include = [
    "/api.py",
    "/kernel.py",
    "/axiom_store.py",
    "/egraphs.py",
    "/generalization.py",
    "/opreof.py",
    "/solving.py",
    "/test_kernel.py",
    "/axioms",
    "/examples",
    "/README.md",
    "/LICENSE",
]
